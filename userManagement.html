<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iLedgerV2 – User Management</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.toolbar-left{display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap}
.toolbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.filter-select{padding:9px 14px;border:1.5px solid var(--border-color);border-radius:var(--radius);font-family:var(--font);font-size:13px;color:var(--text-primary);background:var(--bg-card);cursor:pointer;outline:none;transition:border-color .2s;min-width:140px}
.filter-select:focus{border-color:var(--primary)}
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.summary-item{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border-color);padding:14px 16px}
.summary-item .s-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-secondary)}
.summary-item .s-value{font-size:16px;font-weight:800;color:var(--text-primary);margin-top:4px;letter-spacing:-.3px}
.upload-zone{border:2px dashed var(--border-color);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--gray-50);position:relative}
.upload-zone:hover{border-color:var(--primary);background:rgba(13,71,161,.03)}
.upload-zone svg{width:28px;height:28px;stroke:var(--gray-400);fill:none;stroke-width:1.5;margin-bottom:6px}
.upload-zone p{font-size:12px;color:var(--text-secondary)}
.upload-zone p strong{color:var(--primary)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-preview{position:relative;margin-top:10px;border-radius:var(--radius);overflow:hidden;border:1.5px solid var(--border-color)}
.upload-preview img{width:100%;max-height:160px;object-fit:cover;display:block}
.upload-preview-remove{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:6px;background:rgba(0,0,0,.6);color:white;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.upload-preview-remove svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.nota-thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;cursor:pointer;border:1.5px solid var(--border-color);transition:transform .2s}
.nota-thumb:hover{transform:scale(1.1)}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-secondary)}
.empty-state svg{width:56px;height:56px;stroke:var(--gray-200);fill:none;stroke-width:1.5;margin-bottom:14px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.lightbox.show{opacity:1;pointer-events:all}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px;object-fit:contain}
.lightbox-close{position:absolute;top:20px;right:20px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);border:none;cursor:pointer;color:white;display:flex;align-items:center;justify-content:center}
@media(max-width:768px){.summary-bar{grid-template-columns:repeat(2,1fr)}.toolbar{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>

<div id="navbarMount"></div>

<header class="main-header">
  <button class="header-toggle" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="header-breadcrumb">
    <span>iLedgerV2</span><span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">User Management</span>
  </div>
  <div class="header-actions">
    <button class="header-btn" onclick="toggleTheme()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/></svg></button>
  </div>
</header>

<main class="main-content" id="mainContent">
  <div class="page-header">
    <h1 class="page-title">User Management</h1>
    <p class="page-subtitle">Kelola pengguna dan approval akun (Akses: HRD)</p>
  </div>

  <div id="pendingBanner" style="display:none" class="pending-banner">
    <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span class="pb-text">Ada pengguna menunggu persetujuan <span class="pb-count" id="pendingCount">0</span></span>
  </div>

  <!-- Filter -->
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center">
    <div class="search-bar" style="flex:1;min-width:200px">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="searchInput" placeholder="Cari nama atau email..." oninput="filterUsers()">
    </div>
    <select id="filterStatus" style="padding:9px 14px;border:1.5px solid var(--border-color);border-radius:var(--radius);font-family:var(--font);font-size:13px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;outline:none" onchange="filterUsers()">
      <option value="">Semua Status</option>
      <option value="PENDING">Menunggu</option>
      <option value="ACTIVE">Aktif</option>
      <option value="REJECTED">Ditolak</option>
      <option value="INACTIVE">Nonaktif</option>
    </select>
    <button class="btn btn-outline btn-sm" onclick="loadData()">
      <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.98"/></svg>
      Refresh
    </button>
  </div>

  <div class="users-grid" id="usersGrid"></div>
</main>

<!-- Modal Reject -->
<div class="modal-overlay" id="modalReject">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h3 class="modal-title">Tolak Pengguna</h3>
      <button class="modal-close" onclick="closeModal('modalReject')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="rejectUserId">
      <div class="form-group-m">
        <label class="form-label-m">Alasan Penolakan (opsional)</label>
        <textarea id="rejectReason" class="form-control-m" rows="3" style="resize:none" placeholder="Masukkan alasan penolakan..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modalReject')">Batal</button>
      <button class="btn btn-danger" onclick="confirmReject()">
        <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Tolak
      </button>
    </div>
  </div>
</div>

<script>
// Penambahan Auth check & Navbar Loader sama seperti halaman Dashboard
if (!requireAuth()) throw new Error('Not authenticated');
window.CURRENT_PAGE = 'pemasukan'; // Set page global variable

fetch('navbar.html')
  .then(r => r.text())
  .then(html => {
    document.getElementById('navbarMount').innerHTML = html;
    document.querySelectorAll('#navbarMount script').forEach(s => {
      const ns = document.createElement('script');
      ns.textContent = s.textContent;
      document.body.appendChild(ns);
    });
  });
let allUsers = [];
const avatarBg = ['#0D47A1','#1565C0','#0288D1','#00838F','#6A1B9A','#D84315'];

document.addEventListener('DOMContentLoaded', () => {
  if (_user.role !== 'HRD') {
    document.querySelector('.main-content').innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-secondary)"><h2>Akses Ditolak</h2><p>Halaman ini hanya untuk HRD.</p></div>';
    return;
  }
  loadData();
});

async function loadData() {
  const res = await callAPI('getUsers', {});
  if (!res.success) { showToast('Gagal memuat data.','error'); return; }
  allUsers = res.data;
  const pending = allUsers.filter(u => u.status === 'PENDING').length;
  if (pending > 0) {
    document.getElementById('pendingBanner').style.display = 'flex';
    document.getElementById('pendingCount').textContent = pending;
    const badge = document.getElementById('pendingBadge');
    if (badge) { badge.style.display = 'inline'; badge.textContent = pending; }
  }
  filterUsers();
}

function filterUsers() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const st = document.getElementById('filterStatus').value;
  const filtered = allUsers.filter(u => {
    const matchQ = !q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q);
    const matchS = !st || u.status === st;
    return matchQ && matchS;
  });
  renderUsers(filtered);
}

function renderUsers(data) {
  const container = document.getElementById('usersGrid');
  if (!data.length) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border-color)">Tidak ada pengguna ditemukan.</div>';
    return;
  }
  container.innerHTML = data.map((u, i) => {
    const initials = u.name.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
    const bg = avatarBg[i % avatarBg.length];
    const statusBadge = {
      ACTIVE: 'badge-success', PENDING: 'badge-warning',
      REJECTED: 'badge-error', INACTIVE: 'badge-gray'
    }[u.status] || 'badge-gray';
    const statusLabel = { ACTIVE:'Aktif', PENDING:'Menunggu', REJECTED:'Ditolak', INACTIVE:'Nonaktif' }[u.status] || u.status;
    const roleBadge = u.role === 'HRD' ? 'badge-info' : 'badge-gray';

    const actions = u.status === 'PENDING' ? `
      <button class="btn btn-success btn-sm" onclick="approveUser('${u.userId}')">
        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" fill="none" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Setujui
      </button>
      <button class="btn btn-danger btn-sm" onclick="openRejectModal('${u.userId}')">
        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Tolak
      </button>` : u.userId !== _user.userId ? `
      <button class="btn btn-danger btn-sm" onclick="deleteUser('${u.userId}','${u.name}')">
        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" fill="none" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        Hapus
      </button>` : '<span style="font-size:11px;color:var(--text-secondary)">Akun Anda</span>';

    return `
    <div class="user-card">
      <div class="user-avatar-lg" style="background:${bg}">${initials}</div>
      <div class="user-info-main">
        <div class="user-name-lg">${u.name}</div>
        <div class="user-email-lg">${u.email}</div>
        <div class="user-meta">
          <span class="badge ${statusBadge}">${statusLabel}</span>
          <span class="badge ${roleBadge}">${u.role}</span>
          ${u.lastLogin ? `<span style="font-size:11px;color:var(--text-secondary)">Login: ${u.lastLogin.split(' ')[0]}</span>` : ''}
          ${u.createdAt ? `<span style="font-size:11px;color:var(--text-secondary)">Daftar: ${u.createdAt.split(' ')[0]}</span>` : ''}
        </div>
      </div>
      <div class="user-actions">${actions}</div>
    </div>`;
  }).join('');
}

async function approveUser(userId) {
  const res = await callAPI('approveUser', { userId });
  if (res.success) { showToast('Pengguna berhasil disetujui.','success'); loadData(); }
  else showToast(res.error,'error');
}

function openRejectModal(userId) {
  document.getElementById('rejectUserId').value = userId;
  document.getElementById('rejectReason').value = '';
  openModal('modalReject');
}

async function confirmReject() {
  const userId = document.getElementById('rejectUserId').value;
  const reason = document.getElementById('rejectReason').value;
  const res = await callAPI('rejectUser', { userId, reason });
  if (res.success) { showToast('Pengguna ditolak.','success'); closeModal('modalReject'); loadData(); }
  else showToast(res.error,'error');
}

async function deleteUser(userId, nama) {
  confirmAction(`Hapus pengguna "${nama}"? Tindakan ini tidak dapat dibatalkan.`, async () => {
    const res = await callAPI('deleteUser', { userId });
    if (res.success) { showToast('Pengguna dihapus.','success'); loadData(); }
    else showToast(res.error,'error');
  });
}
</script>
</body>
</html>
